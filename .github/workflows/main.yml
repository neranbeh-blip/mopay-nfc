name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Customer APK
        run: gradle :customer-app:assembleDebug --no-daemon

      - name: Build Merchant APK
        run: gradle :merchant-app:assembleDebug --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p release
          cp customer-app/build/outputs/apk/debug/customer-app-debug.apk release/mopay-customer-debug.apk
          cp merchant-app/build/outputs/apk/debug/merchant-app-debug.apk release/mopay-merchant-debug.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mopay-apks
          path: release/
